<!DOCTYPE html>
<html>
<head>

<title>OCR查看</title>

<style>

body {
    font-family: Arial;
    margin: 40px;
}

.section {
    border: 2px solid #444;
    padding: 15px;
    margin-top: 20px;
}

.title-block {
    background-color: #eef;
}

.tech-block {
    background-color: #efe;
}

pre {
    font-size: 16px;
}

</style>

</head>

<body>

<h2>文件名：</h2>

<p>{{ filename }}</p>

<h3>布局：</h3>

<p>{{ layout }}</p>

<div class="section title-block">

<h2>标题栏</h2>

<pre>

{{ title_text }}

</pre>

</div>

<div class="section tech-block">

<h2>技术要求</h2>

<pre>

{{ tech_text }}

</pre>

</div>

</body>

</html>
